        <script>
            let jerez = new Ciudad("Jerez de la Frontera", "España", "Jerezano");
            jerez.rellenar(213688, { lat: 36.685, lng: -6.126 });

            const ciudad = document.createElement("h2");
            ciudad.textContent = jerez.getNombre();
            document.body.appendChild(ciudad);

            const pais = document.createElement("h3");
            pais.textContent = jerez.getPais();
            document.body.appendChild(pais);

            const infoSecundaria = document.createElement("ul");
            infoSecundaria.innerHTML = jerez.obtenerInfoSecundaria();
            document.body.appendChild(infoSecundaria);

            jerez.coordenadasPunto();

            jerez.getMeteorologiaCarrera();
            jerez.getMeteorologiaEntrenos();
        </script>
